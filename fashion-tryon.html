<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- iOS-specific: allow web-app mode and hide browser chrome -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Jay Quantum ViewAR — Fashion Try-On</title>

    <!--
    ================================================================
    JAY QUANTUM VIEWAR — FASHION TRY-ON MODULE v1.0
    Module 1: Shoe Try-On (MVP)
    
    HOW IT WORKS:
    1. Loads MediaPipe Tasks Vision (Google AI) for foot/body detection
    2. Opens the device back camera (points at feet)
    3. Detects foot position using Pose Landmarker (landmarks 27-32)
    4. Places a 3D shoe GLB model over each foot using Three.js
    5. Updates in real-time as user walks/moves
    
    URL PARAMETERS:
    - ?model=URL       — GLB shoe model to display
    - ?name=Text       — Product display name
    - ?type=shoe       — Try-on type (shoe / clothing / accessory)
    
    EXAMPLE:
    fashion-tryon.html?model=https://raw.githubusercontent.com/.../shoe.glb&name=Nike+Air+Max&type=shoe
    
    COMPATIBILITY:
    - Android Chrome 90+   ✓
    - iOS Safari 15+       ✓  (iOS 16.4+ for best experience)
    - Desktop Chrome       ✓  (for testing)
    ================================================================
    -->

    <style>
        /* ======================================================
           RESET & BASE
        ====================================================== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            /* Outfit: elegant fashion/tech font. Fallback to system fonts. */
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Load Outfit font from Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');


        /* ======================================================
           CAMERA VIDEO FEED — Full-screen background
           The video element IS the AR background.
           Three.js canvas overlays it with transparent background.
        ====================================================== */
        #camera-feed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;    /* Fill the screen, crop as needed */
            z-index: 1;
            background: #000;
            /* No CSS mirroring — back camera is not mirrored */
        }


        /* ======================================================
           THREE.JS AR CANVAS — Transparent overlay
           Shoes are rendered here on top of the camera feed.
           pointer-events: none so taps pass through to the video.
        ====================================================== */
        #ar-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;   /* Clicks pass through */
            z-index: 10;
        }


        /* ======================================================
           LOADING SCREEN
           Shown during MediaPipe + Three.js + GLB initialization
        ====================================================== */
        #loading-screen {
            position: absolute;
            inset: 0;
            background: #080810;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 40px;
            transition: opacity 0.6s ease;
        }

        .loading-logo-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .loading-logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .loading-logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .loading-tagline {
            font-size: 0.75rem;
            font-weight: 400;
            color: rgba(167, 139, 250, 0.7);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 48px;
        }

        .loading-ring {
            width: 56px;
            height: 56px;
            border: 2px solid rgba(124, 58, 237, 0.2);
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-bar-track {
            width: 220px;
            height: 2px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c3aed, #a78bfa);
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        #loading-status {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.5px;
        }


        /* ======================================================
           CAMERA PERMISSION SCREEN
           Shown when camera access hasn't been granted yet
        ====================================================== */
        #permission-screen {
            position: absolute;
            inset: 0;
            background: #080810;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 180;
            padding: 40px;
            text-align: center;
        }

        #permission-screen.active {
            display: flex;
        }

        .perm-icon {
            width: 80px;
            height: 80px;
            background: rgba(124, 58, 237, 0.12);
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 28px;
        }

        .perm-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .perm-desc {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.45);
            line-height: 1.6;
            max-width: 280px;
            margin-bottom: 36px;
        }

        .perm-btn {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 100px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.3px;
        }


        /* ======================================================
           UI OVERLAY — Sits on top of everything
           Contains: top bar, guide, bottom controls
        ====================================================== */
        #ui-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none; /* Most elements are display-only */
        }


        /* ======================================================
           TOP BAR — Product name, back button, mode badge
        ====================================================== */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 52px 20px 28px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background 0.2s;
        }

        .back-btn:active {
            background: rgba(255,255,255,0.2);
        }

        #product-name-display {
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mode-badge {
            flex-shrink: 0;
            background: rgba(124, 58, 237, 0.25);
            border: 1px solid rgba(167, 139, 250, 0.35);
            color: #c4b5fd;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }


        /* ======================================================
           FOOT GUIDE — Center overlay shown when no feet detected
           Helps user understand where to point the camera
        ====================================================== */
        #guide-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #guide-overlay.visible {
            opacity: 1;
        }

        .guide-box {
            width: 200px;
            height: 140px;
            border: 1.5px dashed rgba(255,255,255,0.3);
            border-radius: 24px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated corner accents */
        .guide-box::before, .guide-box::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: rgba(167, 139, 250, 0.8);
            border-style: solid;
        }

        .guide-box::before {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
            border-radius: 4px 0 0 0;
            animation: cornerPulse 2s ease-in-out infinite;
        }

        .guide-box::after {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
            border-radius: 0 0 4px 0;
            animation: cornerPulse 2s ease-in-out infinite 0.5s;
        }

        @keyframes cornerPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.2; }
        }

        .guide-feet-icon {
            font-size: 2.5rem;
            animation: bounce 1.5s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .guide-text {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.65);
            letter-spacing: 0.3px;
            text-align: center;
        }

        /* Down arrow hint */
        .guide-arrow {
            font-size: 1.2rem;
            color: rgba(167, 139, 250, 0.6);
            animation: arrowBounce 1.5s ease-in-out infinite;
        }

        @keyframes arrowBounce {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(4px); opacity: 1; }
        }


        /* ======================================================
           BOTTOM CONTROLS
        ====================================================== */
        #bottom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px 24px 48px;
            background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Status message pill */
        #status-msg {
            background: rgba(8, 8, 16, 0.6);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.85);
            font-size: 0.8rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 100px;
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            max-width: 300px;
            letter-spacing: 0.2px;
        }

        /* Buttons row */
        .btn-row {
            display: flex;
            gap: 20px;
            align-items: center;
            pointer-events: all;
        }

        /* Side action button */
        .side-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.12);
            color: white;
            padding: 10px 18px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background 0.2s, transform 0.1s;
        }

        .side-btn:active {
            background: rgba(255,255,255,0.2);
            transform: scale(0.96);
        }

        /* Main capture button — large circle */
        #capture-btn {
            width: 68px;
            height: 68px;
            background: #fff;
            border: 3px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            pointer-events: all;
        }

        #capture-btn:active {
            transform: scale(0.93);
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }


        /* ======================================================
           TOAST NOTIFICATION
        ====================================================== */
        #toast {
            position: absolute;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(8, 8, 16, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            pointer-events: none;
        }

        #toast.show {
            opacity: 1;
        }


        /* ======================================================
           TRACKING CONFIDENCE DOTS (live feedback)
           Shows when each foot is being tracked
        ====================================================== */
        #tracking-dots {
            position: absolute;
            top: 120px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .track-dot {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.4);
            padding: 5px 10px 5px 8px;
            border-radius: 100px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .track-dot.active {
            opacity: 1;
        }

        .track-dot-circle {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: background 0.3s;
        }

        .track-dot.tracking .track-dot-circle {
            background: #4ade80; /* green when tracking */
        }

        .track-dot-label {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.6);
            font-weight: 500;
        }

    </style>
</head>
<body>

    <!-- ============================================================
         CAMERA VIDEO FEED
         The AR background. Back camera feed rendered here.
         playsinline = required for iOS Safari (prevents fullscreen)
    ============================================================= -->
    <video id="camera-feed"
           autoplay
           muted
           playsinline
           webkit-playsinline>
    </video>


    <!-- ============================================================
         THREE.JS AR CANVAS
         Transparent WebGL canvas — shoes are rendered here
         pointer-events: none allows touch to pass through
    ============================================================= -->
    <canvas id="ar-canvas"></canvas>


    <!-- ============================================================
         LOADING SCREEN
    ============================================================= -->
    <div id="loading-screen">
        <div class="loading-logo-wrap">
            <div class="loading-logo-icon">👟</div>
            <div class="loading-logo-text">Jay Quantum</div>
        </div>
        <div class="loading-tagline">ViewAR Fashion Studio</div>

        <div class="loading-ring"></div>

        <div class="loading-bar-track">
            <div class="loading-bar-fill" id="loading-bar"></div>
        </div>
        <div id="loading-status">Initializing AI engine…</div>
    </div>


    <!-- ============================================================
         CAMERA PERMISSION SCREEN
         Shown if user denies or hasn't granted camera access
    ============================================================= -->
    <div id="permission-screen">
        <div class="perm-icon">📷</div>
        <div class="perm-title">Camera Access Required</div>
        <div class="perm-desc">
            To try on shoes in AR, ViewAR needs your camera.
            Your video is processed entirely on your device — never uploaded or stored.
        </div>
        <button class="perm-btn" id="request-camera-btn">Allow Camera →</button>
    </div>


    <!-- ============================================================
         UI OVERLAY
    ============================================================= -->
    <div id="ui-overlay">

        <!-- Top bar: back button, product name, mode badge -->
        <div id="top-bar">
            <button class="back-btn" id="back-btn" aria-label="Go back">←</button>
            <span id="product-name-display">Loading…</span>
            <span class="mode-badge" id="mode-badge">Try-On</span>
        </div>

        <!-- Foot positioning guide (shown when no feet detected) -->
        <div id="guide-overlay">
            <div class="guide-box">
                <div class="guide-feet-icon">👟</div>
            </div>
            <div class="guide-text">Point camera at your feet</div>
            <div class="guide-arrow">↓</div>
        </div>

        <!-- Foot tracking status indicators (top-right) -->
        <div id="tracking-dots">
            <div class="track-dot" id="dot-left">
                <div class="track-dot-circle"></div>
                <span class="track-dot-label">L foot</span>
            </div>
            <div class="track-dot" id="dot-right">
                <div class="track-dot-circle"></div>
                <span class="track-dot-label">R foot</span>
            </div>
        </div>

        <!-- Bottom: status + capture controls -->
        <div id="bottom-controls">
            <div id="status-msg">Initializing…</div>
            <div class="btn-row">
                <button class="side-btn" id="flip-camera-btn">🔄 Flip</button>
                <button id="capture-btn" aria-label="Capture photo">📸</button>
                <button class="side-btn" id="share-btn">↗ Share</button>
            </div>
        </div>

    </div><!-- /ui-overlay -->


    <!-- Toast notification -->
    <div id="toast" role="alert" aria-live="polite"></div>


    <!-- ============================================================
         ES MODULE SHIMS
         Polyfill for importmap on older iOS Safari (<16.4)
         Must load BEFORE the importmap script tag.
    ============================================================= -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>


    <!-- ============================================================
         IMPORTMAP — Maps bare module specifiers to CDN URLs
         Three.js r160: production-stable, good iOS support
    ============================================================= -->
    <script type="importmap">
    {
        "imports": {
            "three":           "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/":   "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>


    <!-- ============================================================
         MAIN APPLICATION — ES Module
    ============================================================= -->
    <script type="module">

    // ==============================================================
    // IMPORTS
    // ==============================================================
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';


    // ==============================================================
    // SECTION 1: URL PARAMETER PARSING
    // ==============================================================
    // Reads the URL query string to know what to display and how.
    //
    // Usage example:
    //   fashion-tryon.html
    //     ?model=https://raw.githubusercontent.com/.../shoe.glb
    //     &name=Nike+Air+Max+90
    //     &type=shoe

    const urlParams    = new URLSearchParams(window.location.search);
    const MODEL_URL    = urlParams.get('model');
    const TRY_ON_TYPE  = (urlParams.get('type') || 'shoe').toLowerCase();
    const PRODUCT_NAME = urlParams.get('name') || 'Fashion Item';

    // Update UI with product info
    document.getElementById('product-name-display').textContent = PRODUCT_NAME;

    // Set mode badge label
    const modeBadgeEl = document.getElementById('mode-badge');
    if      (TRY_ON_TYPE === 'clothing')  modeBadgeEl.textContent = 'Clothing Try-On';
    else if (TRY_ON_TYPE === 'accessory') modeBadgeEl.textContent = 'Face Try-On';
    else                                   modeBadgeEl.textContent = 'Shoe Try-On';


    // ==============================================================
    // SECTION 2: GLOBAL STATE VARIABLES
    // ==============================================================

    let scene, threeCamera, renderer;       // Three.js core objects
    let leftShoeGroup, rightShoeGroup;       // Container groups for shoes
    let modelLoaded = false;                 // True once GLB is in the scene
    let poseLandmarker = null;               // MediaPipe pose detector instance
    let videoElement = document.getElementById('camera-feed');
    let lastVideoTime = -1;                  // Tracks last processed video frame
    let animationRunning = false;
    let currentFacingMode = 'environment';   // 'environment'=back, 'user'=front
    let feetTrackedLastFrame = false;        // For smooth status transitions


    // ==============================================================
    // SECTION 3: UI HELPER FUNCTIONS
    // ==============================================================

    function setLoadingProgress(percent, message) {
        document.getElementById('loading-bar').style.width = percent + '%';
        document.getElementById('loading-status').textContent = message;
    }

    function hideLoadingScreen() {
        const el = document.getElementById('loading-screen');
        el.style.opacity = '0';
        setTimeout(() => { el.style.display = 'none'; }, 600);
    }

    function setStatus(msg) {
        document.getElementById('status-msg').textContent = msg;
    }

    function showToast(msg, duration = 2800) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), duration);
    }

    function setGuideVisible(visible) {
        const guide = document.getElementById('guide-overlay');
        visible ? guide.classList.add('visible') : guide.classList.remove('visible');
    }

    // Update foot tracking indicators (green dots top-right)
    function updateTrackingDots(leftTracking, rightTracking) {
        const dotL = document.getElementById('dot-left');
        const dotR = document.getElementById('dot-right');

        dotL.classList.toggle('active',   leftTracking || rightTracking);
        dotL.classList.toggle('tracking', leftTracking);
        dotR.classList.toggle('active',   leftTracking || rightTracking);
        dotR.classList.toggle('tracking', rightTracking);
    }


    // ==============================================================
    // SECTION 4: THREE.JS INITIALIZATION
    // ==============================================================
    // Sets up the 3D scene with:
    //   - Orthographic camera: 1 Three.js unit = 1 screen pixel
    //     (makes landmark → world coordinate conversion trivial)
    //   - Transparent background (video shows through)
    //   - Production-quality lighting for shoe models

    function initThreeJS() {
        const W = window.innerWidth;
        const H = window.innerHeight;

        // Create scene
        scene = new THREE.Scene();

        // Orthographic camera — directly maps pixels to world units.
        // The viewing frustum exactly matches the viewport.
        // Origin (0,0) is the center of the screen.
        threeCamera = new THREE.OrthographicCamera(
            -W / 2,   // left edge
             W / 2,   // right edge
             H / 2,   // top edge
            -H / 2,   // bottom edge
            -2000,    // near clip (objects behind camera, allows negative Z)
             2000     // far clip
        );
        threeCamera.position.z = 1000;

        // WebGL renderer — key settings:
        //   alpha: true              → transparent background (video shows through)
        //   premultipliedAlpha: false → correct alpha blending
        //   preserveDrawingBuffer    → required for screenshot capture to work
        //   antialias: true          → smooth shoe edges
        renderer = new THREE.WebGLRenderer({
            canvas: document.getElementById('ar-canvas'),
            alpha: true,
            antialias: true,
            premultipliedAlpha: false,
            preserveDrawingBuffer: true   // IMPORTANT: needed for capturePhoto()
        });
        renderer.setSize(W, H);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.5)); // Cap for performance
        renderer.setClearColor(0x000000, 0); // 0 alpha = fully transparent
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        // Lighting setup — optimized for fashion product visualization
        // Ambient: prevents total darkness in shadowed areas
        const ambient = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambient);

        // Main key light: comes from upper-front (simulates overhead room light)
        const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
        keyLight.position.set(0, 8, 12);
        scene.add(keyLight);

        // Fill light: softens shadows from the key light
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
        fillLight.position.set(-6, -4, 6);
        scene.add(fillLight);

        // Rim light: gives shoes a slight glow to help them stand out from background
        const rimLight = new THREE.DirectionalLight(0xc4b5fd, 0.2); // slight purple tint
        rimLight.position.set(0, -2, -10);
        scene.add(rimLight);
    }


    // ==============================================================
    // SECTION 5: GLB MODEL LOADING & NORMALIZATION
    // ==============================================================
    // Loads the 3D shoe GLB file and:
    //   1. Normalizes its size to 1 world unit (scale-independent)
    //   2. Centers it at the origin
    //   3. Creates two instances: left shoe and right shoe (mirrored)
    //
    // ROTATION NOTE:
    //   Most GLB shoe models are exported with the toe pointing along
    //   +Z and the sole facing -Y. We rotate -90° around X to lay the
    //   shoe flat in the XY plane (viewable from above in our ortho scene).
    //   If your shoe appears rotated wrong, adjust BASE_ROTATION_X below.

    const BASE_ROTATION_X = -Math.PI / 2; // Rotate shoe flat (toe-up view from camera)
    const BASE_ROTATION_Z = 0;            // Adjust if shoe faces wrong direction

    function loadShoeModel(url) {
        return new Promise((resolve, reject) => {
            setLoadingProgress(40, 'Loading 3D shoe model…');

            const loader = new GLTFLoader();

            loader.load(
                url,

                // ✅ SUCCESS callback
                (gltf) => {
                    const model = gltf.scene;

                    // --- Step 1: Measure the model ---
                    const box = new THREE.Box3().setFromObject(model);
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);

                    // --- Step 2: Normalize to 1 unit ---
                    // After this, the shoe is exactly 1 world unit in its longest dimension.
                    // We scale it to foot-pixel-size at runtime.
                    const normalizeScale = 1.0 / maxDim;
                    model.scale.setScalar(normalizeScale);

                    // --- Step 3: Center at origin ---
                    const box2 = new THREE.Box3().setFromObject(model);
                    const center = box2.getCenter(new THREE.Vector3());
                    model.position.sub(center);

                    // --- Step 4: Apply base rotation ---
                    // Rotate to lay shoe flat in the XY camera-facing plane
                    model.rotation.x = BASE_ROTATION_X;
                    model.rotation.z = BASE_ROTATION_Z;

                    // --- Step 5: Create LEFT shoe group ---
                    // We wrap the model in a Group so we can set position/rotation
                    // on the group independently from the model's internal orientation.
                    leftShoeGroup = new THREE.Group();
                    leftShoeGroup.add(model.clone(true));
                    leftShoeGroup.visible = false;
                    scene.add(leftShoeGroup);

                    // --- Step 6: Create RIGHT shoe group ---
                    // Mirror along X to create the right-foot version.
                    // (Most shoes are symmetric; for asymmetric shoes adjust here.)
                    rightShoeGroup = new THREE.Group();
                    const rightModel = model.clone(true);
                    rightModel.scale.x *= -1; // Flip X = mirror
                    rightShoeGroup.add(rightModel);
                    rightShoeGroup.visible = false;
                    scene.add(rightShoeGroup);

                    modelLoaded = true;
                    setLoadingProgress(80, 'Shoe model ready!');
                    console.log('[ViewAR] GLB loaded. Natural size:', maxDim.toFixed(3), 'units');
                    resolve();
                },

                // ⏳ PROGRESS callback
                (xhr) => {
                    if (xhr.total > 0) {
                        const pct = (xhr.loaded / xhr.total) * 100;
                        setLoadingProgress(40 + pct * 0.35, `Loading model: ${Math.round(pct)}%`);
                    }
                },

                // ❌ ERROR callback
                (error) => {
                    console.error('[ViewAR] GLB load failed:', error);
                    // Don't block startup — show warning but continue so camera still works
                    setStatus('⚠️ Could not load shoe model — check the URL');
                    setLoadingProgress(80, 'Model load failed (continuing without model)');
                    resolve(); // Resolve anyway so camera starts
                }
            );
        });
    }


    // ==============================================================
    // SECTION 6: MEDIAPIPE POSE LANDMARKER SETUP
    // ==============================================================
    // Uses the MediaPipe Tasks Vision API (Google AI, free).
    // Detects 33 body landmarks in real-time from video.
    //
    // Key landmarks used for shoe try-on:
    //   27 = left_ankle    28 = right_ankle
    //   29 = left_heel     30 = right_heel
    //   31 = left_foot_index (big toe)
    //   32 = right_foot_index
    //
    // The 'lite' model (~3MB) is used for fast mobile performance.
    // Switch to 'full' model for better accuracy on complex poses.

    async function initMediaPipe() {
        setLoadingProgress(8, 'Loading AI pose detection…');

        // Dynamically import from the MediaPipe CDN
        const { PoseLandmarker, FilesetResolver } = await import(
            'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.mjs'
        );

        setLoadingProgress(22, 'Loading pose model…');

        // Initialize the WASM runtime from CDN
        const vision = await FilesetResolver.forVisionTasks(
            'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm'
        );

        setLoadingProgress(35, 'Building pose detector…');

        // Create the pose landmarker
        poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
            baseOptions: {
                // 'lite' = fastest, good for real-time mobile
                // Replace 'lite' with 'full' or 'heavy' for better accuracy
                modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
                delegate: 'GPU'   // Use device GPU (WebGL). Falls back to CPU if unavailable.
            },
            runningMode: 'VIDEO',   // VIDEO mode = optimized for frame sequences
            numPoses: 1,            // Track one person at a time
            minPoseDetectionConfidence: 0.5,
            minPosePresenceConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        console.log('[ViewAR] MediaPipe PoseLandmarker initialized');
    }


    // ==============================================================
    // SECTION 7: CAMERA ACCESS
    // ==============================================================

    async function startCamera(facingMode = 'environment') {
        // Stop any existing camera stream first
        if (videoElement.srcObject) {
            videoElement.srcObject.getTracks().forEach(t => t.stop());
            videoElement.srcObject = null;
        }

        // Camera constraints:
        // 'environment' = back camera (for pointing at feet)
        // 'user'        = front/selfie camera
        const constraints = {
            video: {
                facingMode: { ideal: facingMode },
                width:     { ideal: 1280 },
                height:    { ideal: 720 },
                frameRate: { ideal: 30, min: 15 }
            },
            audio: false
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = stream;
            currentFacingMode = facingMode;

            // Wait for video metadata to be loaded (gives us width/height)
            await new Promise((resolve, reject) => {
                videoElement.onloadedmetadata = resolve;
                videoElement.onerror = reject;
                // Timeout fallback in case onloadedmetadata never fires
                setTimeout(resolve, 3000);
            });

            // Start playing the video stream
            await videoElement.play();
            console.log('[ViewAR] Camera started:', facingMode,
                        videoElement.videoWidth + 'x' + videoElement.videoHeight);

        } catch (err) {
            if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                // User denied camera — show permission request screen
                document.getElementById('permission-screen').classList.add('active');
                throw err;

            } else if (err.name === 'OverconstrainedError') {
                // Specific constraint failed — retry with simpler constraints
                console.warn('[ViewAR] Camera over-constrained, retrying simpler…');
                const fallbackStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode },
                    audio: false
                });
                videoElement.srcObject = fallbackStream;
                await new Promise(r => {
                    videoElement.onloadedmetadata = r;
                    setTimeout(r, 3000);
                });
                await videoElement.play();

            } else {
                console.error('[ViewAR] Camera error:', err.name, err.message);
                throw err;
            }
        }
    }


    // ==============================================================
    // SECTION 8: COORDINATE TRANSFORMATION
    // ==============================================================
    // Converts a MediaPipe landmark (normalized 0–1) to a Three.js
    // world position (pixels from center).
    //
    // This accounts for the video's object-fit: cover cropping.
    // When the video aspect ratio differs from the screen's, CSS
    // crops the video display — but MediaPipe sees the raw frame.
    // We must apply the same crop offset to landmark coordinates.
    //
    //  MediaPipe coords:  x=0 (left),  y=0 (top),  x=1 (right), y=1 (bottom)
    //  Three.js coords:   x=0 (center), y=0 (center), x increases right, y increases UP

    function landmarkToWorld(lm) {
        const W = window.innerWidth;
        const H = window.innerHeight;
        const videoW = videoElement.videoWidth  || 640;
        const videoH = videoElement.videoHeight || 480;

        const videoAspect  = videoW / videoH;
        const screenAspect = W / H;

        let scaleX = 1, scaleY = 1, offsetX = 0, offsetY = 0;

        if (videoAspect > screenAspect) {
            // Video is WIDER than screen → video is cropped on left and right
            // The video is scaled so height fills screen, width overflows.
            scaleX  = videoAspect / screenAspect;
            offsetX = (scaleX - 1) / 2; // How much is cropped from each side (normalized)
        } else {
            // Video is TALLER than screen → video is cropped on top and bottom
            scaleY  = screenAspect / videoAspect;
            offsetY = (scaleY - 1) / 2;
        }

        // Map normalized landmark coords to screen pixels, accounting for crop
        const screenX = ((lm.x * scaleX) - offsetX) * W;
        const screenY = ((lm.y * scaleY) - offsetY) * H;

        // Convert to Three.js world coordinates (Y flipped: up is positive)
        const worldX = screenX - W / 2;
        const worldY = H / 2 - screenY;

        return new THREE.Vector2(worldX, worldY);
    }


    // ==============================================================
    // SECTION 9: SHOE PLACEMENT LOGIC
    // ==============================================================
    // Places a shoe model on a detected foot by computing:
    //   - Position:  midpoint between heel and toe in world space
    //   - Rotation:  angle the foot is pointing (heel → toe direction)
    //   - Scale:     proportional to heel-to-toe pixel distance
    //
    // Uses temporal smoothing (lerp) to reduce jitter from landmark noise.
    //
    // Landmark indices per foot:
    //   Left:  heel=29, ankle=27, toe=31
    //   Right: heel=30, ankle=28, toe=32

    // Min/max confidence thresholds
    const VIS_MIN = 0.35; // Below this = landmark not reliable enough

    // Smoothing factor (0=no smoothing, 1=never updates)
    // 0.6 feels natural while tracking movement
    const SMOOTH_POSITION = 0.6;
    const SMOOTH_SCALE    = 0.7;

    // Scale factor: shoe is ~15% larger than the bare foot measurement
    const SHOE_OVERSIZE = 1.15;

    function placeShoeOnFoot(heelLm, ankleLm, toeLm, shoeGroup, isMirroredFoot) {
        if (!shoeGroup || !modelLoaded) return false;

        // Check which landmarks are reliably visible
        const heelOK  = heelLm.visibility  > VIS_MIN;
        const ankleOK = ankleLm.visibility > VIS_MIN;
        const toeOK   = toeLm.visibility   > VIS_MIN;

        // Need at least 2 landmarks to determine position AND direction
        const numVisible = (heelOK ? 1 : 0) + (ankleOK ? 1 : 0) + (toeOK ? 1 : 0);
        if (numVisible < 2) {
            shoeGroup.visible = false;
            return false;
        }

        // Convert visible landmarks to world space
        const heelW  = heelOK  ? landmarkToWorld(heelLm)  : null;
        const ankleW = ankleOK ? landmarkToWorld(ankleLm) : null;
        const toeW   = toeOK   ? landmarkToWorld(toeLm)   : null;

        // ----------------------------------------------------------
        // Calculate: foot center, direction angle, and length
        // Prioritizes heel+toe (most accurate), falls back to partial data
        // ----------------------------------------------------------
        let footCenter, footAngle, footLength;

        if (heelOK && toeOK) {
            // ✅ Best case: heel and toe both visible
            footCenter = new THREE.Vector2(
                (heelW.x + toeW.x) / 2,
                (heelW.y + toeW.y) / 2
            );
            footLength = heelW.distanceTo(toeW);
            footAngle  = Math.atan2(toeW.y - heelW.y, toeW.x - heelW.x);

        } else if (ankleOK && toeOK) {
            // Ankle visible but not heel — estimate foot length
            footCenter = new THREE.Vector2(
                (ankleW.x + toeW.x) / 2,
                (ankleW.y + toeW.y) / 2
            );
            footLength = ankleW.distanceTo(toeW) * 1.4; // toe-to-ankle ≈ 70% of total foot
            footAngle  = Math.atan2(toeW.y - ankleW.y, toeW.x - ankleW.x);

        } else if (heelOK && ankleOK) {
            // Heel and ankle visible but not toe — extrapolate toe direction
            const dir = new THREE.Vector2(
                ankleW.x - heelW.x,
                ankleW.y - heelW.y
            );
            // Estimate: ankle-to-heel is roughly 50% of total foot length
            footLength = heelW.distanceTo(ankleW) * 2;
            footAngle  = Math.atan2(dir.y, dir.x);
            const dirNorm = dir.clone().normalize();
            footCenter = new THREE.Vector2(
                heelW.x + dirNorm.x * footLength / 2,
                heelW.y + dirNorm.y * footLength / 2
            );

        } else {
            shoeGroup.visible = false;
            return false;
        }

        // Guard against noise (e.g., briefly tiny detections)
        if (footLength < 15 || !isFinite(footAngle)) {
            shoeGroup.visible = false;
            return false;
        }

        // ----------------------------------------------------------
        // Apply to Three.js shoe group with temporal smoothing
        // ----------------------------------------------------------
        shoeGroup.visible = true;

        // Smooth position (lerp toward target)
        const targetX = footCenter.x;
        const targetY = footCenter.y;

        if (shoeGroup.position.x === 0 && shoeGroup.position.y === 0) {
            // First placement: jump directly (no "sliding in" from center)
            shoeGroup.position.x = targetX;
            shoeGroup.position.y = targetY;
        } else {
            shoeGroup.position.x = shoeGroup.position.x * SMOOTH_POSITION + targetX * (1 - SMOOTH_POSITION);
            shoeGroup.position.y = shoeGroup.position.y * SMOOTH_POSITION + targetY * (1 - SMOOTH_POSITION);
        }
        shoeGroup.position.z = 0;

        // Rotation: align shoe's forward axis with foot direction
        // shoeGroup.rotation.z rotates in the screen plane (around camera axis)
        shoeGroup.rotation.z = footAngle;

        // Scale: proportional to foot pixel size
        // (Our ortho camera = 1 unit per pixel, so scale equals pixels directly)
        const targetScale = footLength * SHOE_OVERSIZE;
        const curScale = Math.abs(shoeGroup.scale.x);
        const smoothedScale = curScale < 5
            ? targetScale  // First frame: jump to correct size
            : curScale * SMOOTH_SCALE + targetScale * (1 - SMOOTH_SCALE);

        shoeGroup.scale.set(
            isMirroredFoot ? -smoothedScale : smoothedScale,  // Mirror X for right foot
            smoothedScale,
            smoothedScale
        );

        return true; // Foot was successfully tracked
    }


    // ==============================================================
    // SECTION 10: MAIN ANIMATION LOOP
    // ==============================================================
    // Runs 60fps via requestAnimationFrame.
    // Each frame:
    //   1. Checks if there's a new video frame to process
    //   2. Runs MediaPipe pose detection (if new frame)
    //   3. Updates shoe positions from pose results
    //   4. Renders the Three.js scene

    function startAnimationLoop() {
        animationRunning = true;

        function frame() {
            if (!animationRunning) return;
            requestAnimationFrame(frame);

            // Only run pose detection on NEW video frames
            // (avoids redundant computation on duplicate frames)
            const videoReady = videoElement.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA;
            const isNewFrame = videoElement.currentTime !== lastVideoTime;

            if (videoReady && isNewFrame) {
                lastVideoTime = videoElement.currentTime;

                if (poseLandmarker && modelLoaded) {
                    try {
                        // detectForVideo() returns synchronously (WebAssembly)
                        const results = poseLandmarker.detectForVideo(
                            videoElement,
                            performance.now() // timestamp in ms
                        );
                        processPoseResults(results);
                    } catch (e) {
                        // Silent fail — missed frames are OK
                        console.warn('[ViewAR] Pose detection error:', e);
                    }
                }
            }

            // Always render — even when not detecting (shoe may be mid-tween)
            renderer.render(scene, threeCamera);
        }

        frame();
    }


    // ==============================================================
    // SECTION 11: POSE RESULTS PROCESSOR
    // ==============================================================
    // Processes MediaPipe results and calls placeShoeOnFoot()
    // for each detected foot.

    function processPoseResults(results) {
        if (!results.landmarks || results.landmarks.length === 0) {
            // No person detected in this frame
            if (leftShoeGroup)  leftShoeGroup.visible  = false;
            if (rightShoeGroup) rightShoeGroup.visible = false;

            if (feetTrackedLastFrame) {
                feetTrackedLastFrame = false;
                setGuideVisible(true);
                setStatus('👣 Move feet back into camera view');
                updateTrackingDots(false, false);
            }
            return;
        }

        // Use the first detected person's landmarks
        const lm = results.landmarks[0];

        // MediaPipe Pose landmark indices:
        //  27=left_ankle  28=right_ankle
        //  29=left_heel   30=right_heel
        //  31=left_foot_index (big toe)  32=right_foot_index
        const leftTracked  = placeShoeOnFoot(lm[29], lm[27], lm[31], leftShoeGroup,  false);
        const rightTracked = placeShoeOnFoot(lm[30], lm[28], lm[32], rightShoeGroup, true);

        const anyTracked = leftTracked || rightTracked;

        if (anyTracked && !feetTrackedLastFrame) {
            // Just found feet — update UI
            feetTrackedLastFrame = true;
            setGuideVisible(false);
            setStatus('✨ Looking great! Walk to see them move');
        } else if (!anyTracked && feetTrackedLastFrame) {
            feetTrackedLastFrame = false;
            setGuideVisible(true);
            setStatus('👟 Point camera down at your feet');
        }

        // Update tracking indicator dots
        updateTrackingDots(leftTracked, rightTracked);
    }


    // ==============================================================
    // SECTION 12: SCREENSHOT / SHARE
    // ==============================================================
    // Merges the camera video frame and Three.js AR overlay into
    // a single JPEG image. Tries Web Share API first (native share
    // sheet on iOS/Android), falls back to direct download.

    async function capturePhoto() {
        setStatus('📸 Saving…');

        // Create offscreen canvas to composite video + AR
        const W = window.innerWidth;
        const H = window.innerHeight;
        const mergeCanvas = document.createElement('canvas');
        mergeCanvas.width  = W * window.devicePixelRatio;
        mergeCanvas.height = H * window.devicePixelRatio;

        const ctx = mergeCanvas.getContext('2d');
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

        // Draw 1: camera video (background)
        // Calculate object-fit: cover positioning to match CSS
        const vW = videoElement.videoWidth;
        const vH = videoElement.videoHeight;
        const videoAspect  = vW / vH;
        const screenAspect = W / H;

        let drawX = 0, drawY = 0, drawW = W, drawH = H;
        if (videoAspect > screenAspect) {
            drawW = H * videoAspect;
            drawX = (W - drawW) / 2;
        } else {
            drawH = W / videoAspect;
            drawY = (H - drawH) / 2;
        }
        ctx.drawImage(videoElement, drawX, drawY, drawW, drawH);

        // Draw 2: Three.js AR canvas (transparent, shoes on top)
        ctx.drawImage(renderer.domElement, 0, 0, W, H);

        // Convert to JPEG blob
        const filename = `viewar-${PRODUCT_NAME.replace(/\s+/g, '-')}.jpg`;

        mergeCanvas.toBlob(async (blob) => {
            // Try Web Share API (iOS/Android native share sheet)
            if (navigator.share && navigator.canShare) {
                const file = new File([blob], filename, { type: 'image/jpeg' });
                if (navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: `${PRODUCT_NAME} — Jay Quantum ViewAR`,
                            text: `Check out this virtual try-on!`
                        });
                        setStatus('✅ Shared successfully!');
                        setTimeout(() => setStatus('✨ Looking great! Walk to see them move'), 2000);
                        return;
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            console.warn('[ViewAR] Share failed:', err);
                        }
                        // Fall through to download
                    }
                }
            }

            // Fallback: trigger direct file download
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href     = url;
            link.download = filename;
            link.click();
            URL.revokeObjectURL(url);

            showToast('📸 Photo saved to downloads!');
            setTimeout(() => setStatus('✨ Looking great! Walk to see them move'), 500);

        }, 'image/jpeg', 0.92);
    }


    // ==============================================================
    // SECTION 13: WINDOW RESIZE HANDLER
    // ==============================================================

    function handleResize() {
        const W = window.innerWidth;
        const H = window.innerHeight;

        // Update orthographic camera to match new viewport
        threeCamera.left   = -W / 2;
        threeCamera.right  =  W / 2;
        threeCamera.top    =  H / 2;
        threeCamera.bottom = -H / 2;
        threeCamera.updateProjectionMatrix();

        // Update renderer pixel dimensions
        renderer.setSize(W, H);
    }


    // ==============================================================
    // SECTION 14: EVENT LISTENERS
    // ==============================================================

    // Back navigation
    document.getElementById('back-btn').addEventListener('click', () => {
        if (history.length > 1) history.back();
        else window.close();
    });

    // Screenshot / capture
    document.getElementById('capture-btn').addEventListener('click', capturePhoto);
    document.getElementById('share-btn').addEventListener('click', capturePhoto);

    // Flip camera (back ↔ front)
    document.getElementById('flip-camera-btn').addEventListener('click', async () => {
        const next = currentFacingMode === 'environment' ? 'user' : 'environment';
        try {
            await startCamera(next);
            showToast(next === 'user' ? '📷 Switched to front camera' : '📷 Switched to back camera');
        } catch (e) {
            showToast('⚠️ Could not switch camera');
        }
    });

    // Camera permission retry
    document.getElementById('request-camera-btn').addEventListener('click', async () => {
        document.getElementById('permission-screen').classList.remove('active');
        try {
            await startCamera('environment');
        } catch (e) {
            showToast('⚠️ Camera permission denied in browser settings');
        }
    });

    // Resize
    window.addEventListener('resize', handleResize);

    // Prevent accidental context menu on long-press (mobile)
    document.addEventListener('contextmenu', e => e.preventDefault());


    // ==============================================================
    // SECTION 15: MAIN STARTUP SEQUENCE
    // ==============================================================
    // Initializes everything in the correct order:
    //   Three.js → MediaPipe → GLB Model → Camera → Start loop

    async function init() {
        try {
            console.log('[ViewAR] ─── Fashion Try-On Module Starting ───');
            console.log('[ViewAR] Type:', TRY_ON_TYPE, '| Product:', PRODUCT_NAME);
            console.log('[ViewAR] Model URL:', MODEL_URL || 'NOT PROVIDED');

            // ── Step 1: Three.js ──────────────────────────────────
            setLoadingProgress(4, 'Setting up 3D scene…');
            initThreeJS();

            // ── Step 2: MediaPipe ─────────────────────────────────
            // This downloads ~3MB WASM + model file from CDN
            await initMediaPipe();

            // ── Step 3: Load GLB shoe model ───────────────────────
            if (MODEL_URL) {
                await loadShoeModel(MODEL_URL);
            } else {
                console.warn('[ViewAR] No ?model= URL provided — try-on will show empty feet');
                setLoadingProgress(80, 'No model URL — demo mode');
            }

            // ── Step 4: Start camera ──────────────────────────────
            setLoadingProgress(85, 'Starting camera…');
            try {
                await startCamera('environment'); // Back camera for pointing at feet
            } catch (cameraErr) {
                // Camera permission screen is shown inside startCamera()
                console.error('[ViewAR] Camera failed to start:', cameraErr.name);
                setLoadingProgress(90, 'Waiting for camera permission…');
                return; // Halt here — user will click "Allow Camera" button
            }

            // ── Step 5: Start render + detection loop ─────────────
            setLoadingProgress(96, 'Starting AR engine…');
            startAnimationLoop();

            // ── Step 6: Show UI ───────────────────────────────────
            setLoadingProgress(100, 'Ready!');
            await new Promise(r => setTimeout(r, 400)); // Brief pause so user sees 100%
            hideLoadingScreen();

            setStatus('👟 Point camera down at your feet');
            setGuideVisible(true);

            console.log('[ViewAR] ─── Ready! ───');

        } catch (err) {
            console.error('[ViewAR] FATAL initialization error:', err);
            setLoadingProgress(0, '⚠️ Failed to start. Please refresh the page.');
        }
    }

    // 🚀 Launch
    init();

    </script>
