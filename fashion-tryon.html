<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Jay Quantum ViewAR — Shoe Try-On</title>
  <!--
  ================================================================
  JAY QUANTUM VIEWAR — SHOE TRY-ON v2.3
  ================================================================
  KEY CHANGE FROM v2.2:
  Previous versions waited for MediaPipe to detect feet before
  showing anything. If detection failed (feet at edge of frame,
  low confidence) the screen stayed empty.

  NEW APPROACH:
  1. Shoe appears IMMEDIATELY at the bottom of the screen
     as soon as the 3D model loads — no waiting for detection.
  2. When MediaPipe detects foot landmarks, shoe smoothly
     moves to track the actual foot position.
  3. If detection is lost, shoe stays at last known position
     for 2 seconds before returning to default bottom position.

  USER EXPERIENCE:
  - Open app → shoe appears at bottom of screen instantly
  - Point camera at feet → shoe snaps to foot
  - Use +/- to resize, ↺↻ to rotate direction
  - Tap 📸 to capture photo

  ALSO FIXED:
  - modelComplexity: 0 (lite — better for partial-body detection)
  - All confidence thresholds lowered to 0.05
  - No ES modules (plain script tags)
  - Back camera default
  ================================================================
  -->
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
    #cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;}
    #ar{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10;}
    #dbg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:11;display:none;}
    #dbg.on{display:block;}

    /* Loading */
    #loader{position:absolute;inset:0;background:#07070f;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:40px;transition:opacity .5s;}
    .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
    .logo-box{width:38px;height:38px;background:linear-gradient(135deg,#a78bfa,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
    .logo-txt{font-size:1.5rem;font-weight:800;color:#fff;}
    .logo-sub{font-size:.7rem;color:rgba(167,139,250,.65);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:44px;}
    .spinner{width:52px;height:52px;border:2px solid rgba(124,58,237,.15);border-top-color:#7c3aed;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:22px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .prog-track{width:200px;height:2px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;margin-bottom:14px;}
    .prog-fill{height:100%;width:0%;background:linear-gradient(90deg,#7c3aed,#a78bfa);transition:width .35s;}
    #prog-txt{font-size:.72rem;color:rgba(255,255,255,.3);}

    /* Permission */
    #perm{position:absolute;inset:0;background:#07070f;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:190;padding:40px;text-align:center;}
    #perm.on{display:flex;}
    .pi{width:76px;height:76px;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.25);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:26px;}
    .pt{font-size:1.35rem;font-weight:700;color:#fff;margin-bottom:10px;}
    .pd{font-size:.84rem;color:rgba(255,255,255,.4);line-height:1.6;max-width:270px;margin-bottom:34px;}
    .pb{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;border:none;padding:15px 38px;border-radius:100px;font-size:.93rem;font-weight:600;font-family:inherit;cursor:pointer;}

    /* UI */
    #ui{position:absolute;inset:0;z-index:20;pointer-events:none;}
    #topbar{position:absolute;top:0;left:0;right:0;padding:50px 18px 24px;background:linear-gradient(to bottom,rgba(0,0,0,.72),transparent);display:flex;align-items:center;gap:10px;}
    .back-btn{width:36px;height:36px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);border-radius:50%;color:#fff;font-size:.95rem;cursor:pointer;pointer-events:all;display:flex;align-items:center;justify-content:center;}
    #pname{color:#fff;font-size:.93rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .badge{background:rgba(124,58,237,.22);border:1px solid rgba(167,139,250,.3);color:#c4b5fd;font-size:.6rem;font-weight:700;padding:3px 9px;border-radius:100px;text-transform:uppercase;letter-spacing:1px;}

    /* Hint bar — shown above controls */
    #hint{position:absolute;bottom:185px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;transition:opacity .4s;}
    #hint.hide{opacity:0;}
    .hint-pill{background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);border-radius:100px;padding:8px 18px;font-size:.78rem;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:7px;}

    /* Tracking dots */
    #dots{position:absolute;top:115px;right:14px;display:flex;flex-direction:column;gap:7px;pointer-events:none;}
    .dot{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);padding:4px 10px 4px 7px;border-radius:100px;opacity:0;transition:opacity .3s;}
    .dot.on{opacity:1;}
    .dot-c{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .25s;}
    .dot.ok .dot-c{background:#4ade80;}
    .dot-lbl{font-size:.62rem;color:rgba(255,255,255,.55);font-weight:500;}

    /* Bottom controls */
    #bottom{position:absolute;bottom:0;left:0;right:0;padding:16px 20px 42px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);display:flex;flex-direction:column;align-items:center;gap:12px;}
    #status{background:rgba(5,5,15,.65);border:1px solid rgba(255,255,255,.09);color:rgba(255,255,255,.88);font-size:.78rem;font-weight:500;padding:7px 16px;border-radius:100px;text-align:center;backdrop-filter:blur(12px);max-width:300px;}
    .btns{display:flex;gap:14px;align-items:center;pointer-events:all;}
    .sbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13);color:#fff;padding:9px 15px;border-radius:100px;font-size:.78rem;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:5px;}
    #capbtn{width:66px;height:66px;background:#fff;border:3px solid rgba(255,255,255,.4);border-radius:50%;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.4);pointer-events:all;}
    .adj-row{display:flex;gap:8px;align-items:center;pointer-events:all;}
    .adj-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.1rem;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .adj-btn.p{background:rgba(124,58,237,.2);border-color:rgba(167,139,250,.3);color:#c4b5fd;font-size:.8rem;padding:0 12px;width:auto;border-radius:100px;}
    .adj-lbl{font-size:.7rem;color:rgba(255,255,255,.4);padding:0 2px;}

    #toast{position:absolute;bottom:160px;left:50%;transform:translateX(-50%);background:rgba(5,5,15,.85);border:1px solid rgba(255,255,255,.1);color:#fff;padding:9px 18px;border-radius:100px;font-size:.78rem;z-index:55;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;}
    #toast.on{opacity:1;}
  </style>
</head>
<body>

<video id="cam" autoplay muted playsinline webkit-playsinline></video>
<canvas id="ar"></canvas>
<canvas id="dbg"></canvas>

<div id="loader">
  <div class="logo-row"><div class="logo-box">👟</div><div class="logo-txt">Jay Quantum</div></div>
  <div class="logo-sub">ViewAR Fashion Studio</div>
  <div class="spinner"></div>
  <div class="prog-track"><div class="prog-fill" id="prog"></div></div>
  <div id="prog-txt">Initializing…</div>
</div>

<div id="perm">
  <div class="pi">📷</div>
  <div class="pt">Camera Access Required</div>
  <div class="pd">ViewAR needs your camera to overlay shoes on your feet. Nothing is recorded or uploaded.</div>
  <button class="pb" id="allow-btn">Allow Camera →</button>
</div>

<div id="ui">
  <div id="topbar">
    <button class="back-btn" id="back-btn">←</button>
    <span id="pname">Loading…</span>
    <span class="badge">Shoe Try-On</span>
  </div>

  <!-- Hint bar above buttons -->
  <div id="hint">
    <div class="hint-pill" id="hint-txt">📱 Point camera at your feet</div>
  </div>

  <div id="dots">
    <div class="dot" id="dot-l"><div class="dot-c"></div><span class="dot-lbl">L foot</span></div>
    <div class="dot" id="dot-r"><div class="dot-c"></div><span class="dot-lbl">R foot</span></div>
  </div>

  <div id="bottom">
    <div id="status">Loading shoe…</div>
    <div class="btns">
      <button class="sbtn" id="flip-btn">🔄 Flip</button>
      <button id="capbtn">📸</button>
      <button class="sbtn" id="share-btn">↗ Share</button>
    </div>
    <div class="adj-row">
      <button class="adj-btn" id="sz-dn">−</button>
      <span class="adj-lbl">Size</span>
      <button class="adj-btn" id="sz-up">＋</button>
      <span class="adj-lbl" style="padding:0 6px;color:rgba(255,255,255,.2);">|</span>
      <button class="adj-btn p" id="rot-l">↺</button>
      <span class="adj-lbl">Dir</span>
      <button class="adj-btn p" id="rot-r">↻</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<!-- Three.js r134 — non-module (global THREE) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
<!-- MediaPipe Pose legacy — non-module -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<script>
(function(){
'use strict';

// ── URL params ────────────────────────────────────────────────────
var P         = new URLSearchParams(location.search);
var MODEL_URL = P.get('model');
var PROD_NAME = P.get('name') || 'Fashion Item';
var SHOW_DBG  = P.get('debug') === '1';

document.getElementById('pname').textContent = PROD_NAME;
if (SHOW_DBG) document.getElementById('dbg').classList.add('on');

// ── User-adjustable ───────────────────────────────────────────────
var SIZE_FACTOR = 0.40;   // shoe = 40% of screen width (user changes with +/-)
var ROT_OFFSET  = 0;      // extra rotation degrees (user changes with ↺↻)

// ── Globals ───────────────────────────────────────────────────────
var video   = document.getElementById('cam');
var arCvs   = document.getElementById('ar');
var dbgCvs  = document.getElementById('dbg');
var dbgCtx  = dbgCvs.getContext('2d');

var scene, orthoCam, renderer;
var leftGrp, rightGrp;
var modelLoaded  = false;
var pose, poseReady = false;
var camFacing = 'environment';
var rotCvs = null, rotCtx2 = null;

// ── Persistence: keep shoe visible after detection is lost ────────
// lastKnown stores the last detected world position for each foot.
// shoe stays visible for PERSIST_FRAMES frames without new detection.
var PERSIST_FRAMES = 90;  // ~3 seconds at 30fps
var lastKnown = {
  left:  { x:null, y:null, angle:0, ttl:0 },
  right: { x:null, y:null, angle:0, ttl:0 }
};

// ── Default shoe position (used before any detection) ─────────────
// Shoes appear at the bottom-centre of screen immediately.
// The user moves the camera until the shoe aligns with their foot.
function defaultPos(isLeft) {
  var W = window.innerWidth, H = window.innerHeight;
  var gap = W * 0.14;
  return {
    x: isLeft ? -gap : gap,           // left of centre / right of centre
    y: -(H / 2) + H * 0.14           // 14% from bottom edge
  };
}

// ── UI helpers ────────────────────────────────────────────────────
function $$(id){ return document.getElementById(id); }
function setProgress(p,t){ $$('prog').style.width=p+'%'; $$('prog-txt').textContent=t; }
function hideLoader(){ var el=$$('loader'); el.style.opacity='0'; setTimeout(function(){ el.style.display='none'; },550); }
function setStatus(t){ $$('status').textContent=t; }
function setHint(t){ $$('hint-txt').textContent=t; }
function showToast(m,ms){
  ms=ms||2400; var t=$$('toast'); t.textContent=m;
  t.classList.add('on'); setTimeout(function(){ t.classList.remove('on'); },ms);
}
function setDots(l,r){
  var dl=$$('dot-l'), dr=$$('dot-r');
  dl.classList.toggle('on',l||r); dl.classList.toggle('ok',l);
  dr.classList.toggle('on',l||r); dr.classList.toggle('ok',r);
}

// ── Three.js ──────────────────────────────────────────────────────
function initThree(){
  var W=window.innerWidth, H=window.innerHeight;
  scene = new THREE.Scene();
  orthoCam = new THREE.OrthographicCamera(-W/2,W/2,H/2,-H/2,-2000,2000);
  orthoCam.position.z = 1000;

  renderer = new THREE.WebGLRenderer({
    canvas:arCvs, alpha:true, antialias:true,
    premultipliedAlpha:false, preserveDrawingBuffer:true
  });
  renderer.setSize(W,H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setClearColor(0x000000,0);
  renderer.outputEncoding = THREE.sRGBEncoding;

  scene.add(new THREE.AmbientLight(0xffffff,0.9));
  var k=new THREE.DirectionalLight(0xffffff,1.1); k.position.set(2,4,8); scene.add(k);
  var f=new THREE.DirectionalLight(0xffffff,0.4); f.position.set(-3,-2,5); scene.add(f);
}

// ── GLB loading ───────────────────────────────────────────────────
function loadModel(url){
  setProgress(42,'Loading 3D shoe model…');
  new THREE.GLTFLoader().load(url,
    function(gltf){
      var m=gltf.scene;
      // Double-sided: shoe visible from any camera angle
      m.traverse(function(c){
        if(!c.isMesh) return;
        [].concat(c.material).forEach(function(mat){ mat.side=THREE.DoubleSide; mat.needsUpdate=true; });
      });
      // Normalise bounding box to 1 unit
      var box=new THREE.Box3().setFromObject(m);
      var sz=box.getSize(new THREE.Vector3());
      var mx=Math.max(sz.x,sz.y,sz.z);
      if(!isFinite(mx)||mx<1e-5||mx>1e5) mx=1;
      console.log('[ViewAR] Shoe dims',sz.x.toFixed(3),sz.y.toFixed(3),sz.z.toFixed(3));
      m.scale.setScalar(1/mx);
      m.position.sub(new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3()));

      // Left shoe group
      leftGrp=new THREE.Group(); leftGrp.add(m.clone(true)); scene.add(leftGrp);
      // Right shoe group — X-mirrored
      rightGrp=new THREE.Group();
      var rm=m.clone(true); rm.scale.x*=-1; rightGrp.add(rm); scene.add(rightGrp);

      modelLoaded=true;
      setProgress(82,'Shoe loaded!');
      setStatus('👟 Point camera down at your feet');
      setHint('📱 Point camera at your feet — shoe is below');

      // Place shoes at default position immediately
      placeAtDefault();

      console.log('[ViewAR] Model ready');
    },
    function(xhr){ if(xhr.total>0) setProgress(42+(xhr.loaded/xhr.total)*36,'Loading: '+Math.round(xhr.loaded/xhr.total*100)+'%'); },
    function(err){ console.error('[ViewAR] GLB error:',err); setProgress(82,'Model error'); setStatus('⚠️ Could not load shoe model'); }
  );
}

// Place shoes at default bottom-of-screen position
function placeAtDefault(){
  if(!leftGrp||!rightGrp) return;
  var size = window.innerWidth * SIZE_FACTOR;
  var angle = ROT_OFFSET * (Math.PI/180);

  ['left','right'].forEach(function(side){
    var isLeft = side==='left';
    var grp = isLeft ? leftGrp : rightGrp;
    var dp = defaultPos(isLeft);
    grp.position.set(dp.x, dp.y, 0);
    grp.quaternion.setFromEuler(new THREE.Euler(0,0,angle,'XYZ'));
    grp.scale.set(isLeft?size:-size, size, size);
    grp.visible = true;
    grp.userData.placed = true;
    lastKnown[side].x = dp.x;
    lastKnown[side].y = dp.y;
    lastKnown[side].angle = angle;
    lastKnown[side].ttl = 0;  // 0 = default, not from detection
  });
}

// ── MediaPipe Pose ────────────────────────────────────────────────
function initPose(cb){
  setProgress(8,'Loading AI pose engine…');
  try {
    pose = new Pose({
      locateFile: function(f){ return 'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+f; }
    });
    pose.setOptions({
      modelComplexity: 0,         // 0=lite — fastest, better for partial body
      smoothLandmarks: true,
      enableSegmentation: false,
      smoothSegmentation: false,
      minDetectionConfidence: 0.1, // very low = detects even partial views
      minTrackingConfidence: 0.1
    });
    pose.onResults(onPoseResults);
    setProgress(38,'AI engine ready');
    poseReady = true;
    if(cb) cb();
  } catch(e){
    console.error('[ViewAR] Pose init failed:',e);
    setProgress(0,'⚠️ AI failed. Try refreshing.');
  }
}

// ── Camera ────────────────────────────────────────────────────────
function startCamera(facing, onOK, onFail){
  if(video.srcObject) video.srcObject.getTracks().forEach(function(t){ t.stop(); });
  video.srcObject=null;
  video.style.transform='none'; // no mirror for back camera

  navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ideal:facing}, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30,min:15} },
    audio:false
  })
  .then(function(s){
    video.srcObject=s; camFacing=facing;
    var done=false;
    function go(){ if(done) return; done=true; video.play().then(function(){
      console.log('[ViewAR] Camera:',facing, video.videoWidth+'x'+video.videoHeight);
      setupRotCanvas(); if(onOK) onOK();
    }); }
    video.onloadedmetadata=go; setTimeout(go,3000);
  })
  .catch(function(err){
    console.error('[ViewAR] Cam error:',err.name);
    if(err.name==='NotAllowedError') $$('perm').classList.add('on');
    if(onFail) onFail(err);
  });
}

// ── Rotation canvas ───────────────────────────────────────────────
// Android back camera outputs landscape buffer (1280×720) even in
// portrait. We rotate it 90° CW so MediaPipe sees portrait frame
// and gives landmarks in correct portrait screen coordinates.
function setupRotCanvas(){
  var vW=video.videoWidth, vH=video.videoHeight;
  var W=window.innerWidth, H=window.innerHeight;
  var needRot=(vW>vH)&&(H>W);
  console.log('[ViewAR] Video',vW+'x'+vH,'Screen',W+'x'+H,'Rotate:',needRot);
  if(!needRot){ rotCvs=null; return; }
  rotCvs=document.createElement('canvas');
  rotCvs.width=W; rotCvs.height=H;
  rotCtx2=rotCvs.getContext('2d');
}

function getFrame(){
  if(!rotCvs) return video;
  var vW=video.videoWidth,vH=video.videoHeight,W=rotCvs.width,H=rotCvs.height;
  rotCtx2.clearRect(0,0,W,H);
  rotCtx2.save();
  rotCtx2.translate(W,0); rotCtx2.rotate(Math.PI/2);
  var sc=Math.max(H/vW,W/vH);
  rotCtx2.drawImage(video,(H-vW*sc)/2,(W-vH*sc)/2,vW*sc,vH*sc);
  rotCtx2.restore();
  return rotCvs;
}

// ── Coordinate mapping ────────────────────────────────────────────
function lmToWorld(lm){
  var W=window.innerWidth, H=window.innerHeight;
  return { x:lm.x*W-W/2, y:H/2-lm.y*H };
}

// ── Debug dots ────────────────────────────────────────────────────
var DBG_COL={27:'#f87171',28:'#fca5a5',29:'#4ade80',30:'#86efac',31:'#22d3ee',32:'#67e8f9',25:'#fb923c',26:'#fbbf24'};
function drawDebug(lms){
  dbgCtx.clearRect(0,0,dbgCvs.width,dbgCvs.height);
  if(!lms) return;
  var W=window.innerWidth,H=window.innerHeight;
  [25,26,27,28,29,30,31,32].forEach(function(i){
    var lm=lms[i]; if(!lm||lm.visibility<0.05) return;
    var sx=lm.x*W, sy=lm.y*H;
    dbgCtx.beginPath(); dbgCtx.arc(sx,sy,13,0,Math.PI*2);
    dbgCtx.fillStyle=DBG_COL[i]||'#fff'; dbgCtx.fill();
    dbgCtx.strokeStyle='#fff'; dbgCtx.lineWidth=2; dbgCtx.stroke();
    dbgCtx.fillStyle='#000'; dbgCtx.font='bold 10px sans-serif';
    dbgCtx.textAlign='center'; dbgCtx.textBaseline='middle';
    dbgCtx.fillText(i,sx,sy);
  });
}

// ── Shoe placement ────────────────────────────────────────────────
//
// STRATEGY:
// 1. Try to get ankle landmark with visibility > 0.05
// 2. If found: move shoe to detected position, save to lastKnown
// 3. If not found but lastKnown.ttl > 0: use last position (persist)
// 4. If not found and ttl = 0: use default bottom position
//
// This means the shoe is ALWAYS visible — either tracking the foot,
// showing last position, or showing the default starting position.

var POS_LERP = 0.4;
var SCL_LERP = 0.5;

function updateShoe(lms, isLeft){
  var grp = isLeft ? leftGrp : rightGrp;
  if(!grp || !modelLoaded) return false;

  var side     = isLeft ? 'left' : 'right';
  var ankleIdx = isLeft ? 27 : 28;
  var heelIdx  = isLeft ? 29 : 30;
  var toeIdx   = isLeft ? 31 : 32;
  var size     = window.innerWidth * SIZE_FACTOR;

  var detected = false;
  var tx, ty, angle;

  // Try detection
  if(lms){
    var ankle = lms[ankleIdx];
    if(ankle && ankle.visibility > 0.05){
      detected = true;
      var aW = lmToWorld(ankle);
      tx = aW.x; ty = aW.y;

      // Direction from heel→toe when available
      angle = ROT_OFFSET * (Math.PI/180);
      var heel=lms[heelIdx], toe=lms[toeIdx];
      if(heel&&toe&&heel.visibility>0.05&&toe.visibility>0.05){
        var hW=lmToWorld(heel), tW=lmToWorld(toe);
        angle = Math.atan2(tW.y-hW.y, tW.x-hW.x) + ROT_OFFSET*(Math.PI/180);
      }

      // Shift forward toward toe by 20% of shoe size
      tx += Math.cos(angle)*size*0.20;
      ty += Math.sin(angle)*size*0.20;

      // Save to lastKnown
      lastKnown[side].x     = tx;
      lastKnown[side].y     = ty;
      lastKnown[side].angle = angle;
      lastKnown[side].ttl   = PERSIST_FRAMES;
    }
  }

  if(!detected){
    if(lastKnown[side].ttl > 0){
      // Use last known position (persist for a few seconds)
      lastKnown[side].ttl--;
      tx    = lastKnown[side].x;
      ty    = lastKnown[side].y;
      angle = lastKnown[side].angle;
    } else {
      // Fall back to default bottom position
      var dp = defaultPos(isLeft);
      tx = dp.x; ty = dp.y;
      angle = ROT_OFFSET * (Math.PI/180);
    }
  }

  // Apply position (smoothed lerp)
  grp.visible = true;
  if(!grp.userData.placed){
    grp.position.set(tx, ty, 0);
    grp.userData.placed = true;
  } else {
    grp.position.x = grp.position.x*POS_LERP + tx*(1-POS_LERP);
    grp.position.y = grp.position.y*POS_LERP + ty*(1-POS_LERP);
    grp.position.z = 0;
  }

  // Rotation flat in XY plane
  grp.quaternion.setFromEuler(new THREE.Euler(0,0,angle,'XYZ'));

  // Scale (smoothed)
  var curS = Math.abs(grp.scale.x) || size;
  var s    = curS*SCL_LERP + size*(1-SCL_LERP);
  grp.scale.set(isLeft?s:-s, s, s);

  return detected;
}

// ── Pose results handler ──────────────────────────────────────────
function onPoseResults(results){
  var lms = results.poseLandmarks || null;
  if(SHOW_DBG) drawDebug(lms);

  var L = updateShoe(lms, true);
  var R = updateShoe(lms, false);
  var any = L || R;

  setDots(L, R);

  if(any){
    setStatus('✨ Looking great! Use +/- to adjust size');
    setHint('✅ Tracking feet — walk to see shoes move');
  } else {
    setStatus('👟 Point camera down at your feet');
    setHint('📱 Shoe shown at default position — move camera to align');
  }
}

// ── Loops ─────────────────────────────────────────────────────────
var lastT=-1;
function poseLoop(){
  requestAnimationFrame(poseLoop);
  if(!poseReady||video.readyState<2||video.currentTime===lastT) return;
  lastT=video.currentTime;
  pose.send({image:getFrame()}).catch(function(){});
}
function renderLoop(){
  requestAnimationFrame(renderLoop);
  renderer.render(scene,orthoCam);
}

// ── Screenshot ────────────────────────────────────────────────────
function capture(){
  setStatus('📸 Saving…');
  var W=window.innerWidth,H=window.innerHeight;
  var mc=document.createElement('canvas');
  mc.width=W*window.devicePixelRatio; mc.height=H*window.devicePixelRatio;
  var ctx=mc.getContext('2d');
  ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  ctx.drawImage(video,0,0,W,H);
  ctx.drawImage(renderer.domElement,0,0,W,H);
  var fname='viewar-'+PROD_NAME.replace(/\s+/g,'-')+'.jpg';
  mc.toBlob(function(blob){
    if(navigator.share&&navigator.canShare){
      var f=new File([blob],fname,{type:'image/jpeg'});
      if(navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:PROD_NAME})
          .then(function(){ setStatus('✅ Shared!'); })
          .catch(function(){ dl(blob,fname); });
        return;
      }
    }
    dl(blob,fname);
  },'image/jpeg',0.92);
}
function dl(blob,fname){
  var u=URL.createObjectURL(blob);
  Object.assign(document.createElement('a'),{href:u,download:fname}).click();
  URL.revokeObjectURL(u);
  showToast('📸 Saved!');
  setTimeout(function(){ setStatus('✨ Looking great!'); },700);
}

// ── Resize ────────────────────────────────────────────────────────
window.addEventListener('resize',function(){
  var W=window.innerWidth,H=window.innerHeight;
  orthoCam.left=-W/2; orthoCam.right=W/2; orthoCam.top=H/2; orthoCam.bottom=-H/2;
  orthoCam.updateProjectionMatrix(); renderer.setSize(W,H);
  dbgCvs.width=W; dbgCvs.height=H;
  if(rotCvs){ rotCvs.width=W; rotCvs.height=H; }
});

// ── Button events ─────────────────────────────────────────────────
$$('back-btn').addEventListener('click',function(){ if(history.length>1) history.back(); else window.close(); });
$$('capbtn').addEventListener('click',capture);
$$('share-btn').addEventListener('click',capture);

$$('flip-btn').addEventListener('click',function(){
  var nxt=camFacing==='environment'?'user':'environment';
  startCamera(nxt,function(){
    showToast(nxt==='user'?'🤳 Front camera':'📷 Back camera');
  },function(){ showToast('⚠️ Could not switch'); });
});

$$('sz-up').addEventListener('click',function(){
  SIZE_FACTOR=Math.min(SIZE_FACTOR+0.05,0.9);
  if(leftGrp)  leftGrp.userData.placed=false;
  if(rightGrp) rightGrp.userData.placed=false;
  showToast('Size: '+Math.round(SIZE_FACTOR*100)+'%');
});
$$('sz-dn').addEventListener('click',function(){
  SIZE_FACTOR=Math.max(SIZE_FACTOR-0.05,0.08);
  if(leftGrp)  leftGrp.userData.placed=false;
  if(rightGrp) rightGrp.userData.placed=false;
  showToast('Size: '+Math.round(SIZE_FACTOR*100)+'%');
});

$$('rot-l').addEventListener('click',function(){ ROT_OFFSET-=15; showToast('↺ '+ROT_OFFSET+'°'); });
$$('rot-r').addEventListener('click',function(){ ROT_OFFSET+=15; showToast('↻ '+ROT_OFFSET+'°'); });

$$('allow-btn').addEventListener('click',function(){
  $$('perm').classList.remove('on');
  startCamera('environment',function(){},function(){ showToast('⚠️ Camera denied in browser settings'); });
});
document.addEventListener('contextmenu',function(e){ e.preventDefault(); });

// ── Startup ───────────────────────────────────────────────────────
function init(){
  console.log('[ViewAR] v2.3 | product:',PROD_NAME,'| model:',MODEL_URL);
  setProgress(4,'Setting up 3D scene…'); initThree(); renderLoop();

  if(MODEL_URL) loadModel(MODEL_URL);
  else{ setProgress(82,'No model URL'); setStatus('⚠️ No ?model= URL provided'); }

  initPose(function(){
    setProgress(86,'Starting camera…');
    startCamera('environment',
      function(){
        dbgCvs.width=window.innerWidth; dbgCvs.height=window.innerHeight;
        poseLoop();
        setProgress(100,'Ready!');
        setTimeout(hideLoader,350);
        console.log('[ViewAR] v2.3 Ready!');
      },
      function(){ setProgress(90,'Waiting for camera permission…'); }
    );
  });
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();

})();
</script>
