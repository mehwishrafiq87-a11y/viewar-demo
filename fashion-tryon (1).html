<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Jay Quantum ViewAR — Fashion Try-On</title>

    <!--
    ================================================================
    JAY QUANTUM VIEWAR — FASHION TRY-ON v1.3
    ================================================================
    FIXES IN v1.3:
    - Pre-rotates the raw camera video onto an offscreen canvas BEFORE
      feeding it to MediaPipe. This means landmarks come out in correct
      portrait screen coordinates automatically — no axis-swap math.
    - Android back camera outputs landscape (1280x720) raw buffer even
      when phone is portrait. The browser auto-rotates it for display
      but MediaPipe sees the raw buffer. We now rotate it ourselves
      (same rotation the browser applies) so MediaPipe + display match.
    - Shoe scale fix: footLength guard added so shoe is never tiny.
    - Double-sided shoe materials kept from v1.2.

    URL PARAMS:
    ?model=URL    GLB shoe file to load
    ?name=Text    Product name
    ?type=shoe    Module type
    ?debug=1      Show coloured landmark dots (for testing)
    ?flip=1       Try this if dots appear but are upside-down
    ?scale=1.5    Shoe size multiplier (default 1.3)
    ================================================================
    -->

    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; }

        #camera-feed {
            position:absolute; inset:0; width:100%; height:100%;
            object-fit:cover; z-index:1;
        }
        #ar-canvas {
            position:absolute; inset:0; width:100%; height:100%;
            pointer-events:none; z-index:10;
        }
        #debug-canvas {
            position:absolute; inset:0; width:100%; height:100%;
            pointer-events:none; z-index:12; display:none;
        }
        #debug-canvas.on { display:block; }

        /* Loading */
        #loading-screen {
            position:absolute; inset:0; background:#080810;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            z-index:200; padding:40px; transition:opacity .6s;
        }
        .ld-logo { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
        .ld-icon { width:36px; height:36px; background:linear-gradient(135deg,#a78bfa,#7c3aed); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; }
        .ld-name { font-size:1.4rem; font-weight:800; color:#fff; }
        .ld-tag { font-size:.75rem; color:rgba(167,139,250,.7); letter-spacing:2px; text-transform:uppercase; margin-bottom:48px; }
        .ld-ring { width:56px; height:56px; border:2px solid rgba(124,58,237,.2); border-top-color:#7c3aed; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:24px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .ld-track { width:220px; height:2px; background:rgba(255,255,255,.08); border-radius:2px; overflow:hidden; margin-bottom:16px; }
        .ld-fill { height:100%; width:0%; background:linear-gradient(90deg,#7c3aed,#a78bfa); border-radius:2px; transition:width .4s; }
        #ld-status { font-size:.75rem; color:rgba(255,255,255,.35); }

        /* Permission */
        #perm-screen {
            position:absolute; inset:0; background:#080810;
            display:none; flex-direction:column; align-items:center; justify-content:center;
            z-index:180; padding:40px; text-align:center;
        }
        #perm-screen.on { display:flex; }
        .perm-icon { width:80px; height:80px; background:rgba(124,58,237,.12); border:1px solid rgba(124,58,237,.3); border-radius:24px; display:flex; align-items:center; justify-content:center; font-size:36px; margin-bottom:28px; }
        .perm-title { font-size:1.4rem; font-weight:700; color:#fff; margin-bottom:12px; }
        .perm-desc { font-size:.85rem; color:rgba(255,255,255,.45); line-height:1.6; max-width:280px; margin-bottom:36px; }
        .perm-btn { background:linear-gradient(135deg,#7c3aed,#a78bfa); color:#fff; border:none; padding:16px 40px; border-radius:100px; font-size:.95rem; font-weight:600; font-family:inherit; cursor:pointer; }

        /* UI overlay */
        #ui { position:absolute; inset:0; z-index:20; pointer-events:none; }

        #top-bar {
            position:absolute; top:0; left:0; right:0;
            padding:52px 20px 28px;
            background:linear-gradient(to bottom,rgba(0,0,0,.75) 0%,transparent 100%);
            display:flex; align-items:center; gap:12px;
        }
        .back-btn { width:38px; height:38px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.12); border-radius:50%; color:#fff; font-size:1rem; cursor:pointer; pointer-events:all; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(12px); }
        #prod-name { color:#fff; font-size:.95rem; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .mode-badge { background:rgba(124,58,237,.25); border:1px solid rgba(167,139,250,.35); color:#c4b5fd; font-size:.65rem; font-weight:700; padding:4px 10px; border-radius:100px; text-transform:uppercase; letter-spacing:1px; }

        /* Guide */
        #guide {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            pointer-events:none; opacity:0; transition:opacity .5s;
            display:flex; flex-direction:column; align-items:center; gap:16px;
        }
        #guide.on { opacity:1; }
        .g-box { width:200px; height:140px; border:1.5px dashed rgba(255,255,255,.3); border-radius:24px; display:flex; align-items:center; justify-content:center; }
        .g-icon { font-size:2.5rem; animation:bob 1.5s ease-in-out infinite; }
        @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
        .g-text { font-size:.8rem; color:rgba(255,255,255,.65); text-align:center; }

        /* Tracking dots */
        #dots { position:absolute; top:120px; right:16px; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
        .dot { display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.4); padding:5px 10px 5px 8px; border-radius:100px; opacity:0; transition:opacity .3s; }
        .dot.on { opacity:1; }
        .dot-circle { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.3); transition:background .3s; }
        .dot.ok .dot-circle { background:#4ade80; }
        .dot-label { font-size:.65rem; color:rgba(255,255,255,.6); font-weight:500; }

        /* Bottom */
        #bottom { position:absolute; bottom:0; left:0; right:0; padding:24px 24px 48px; background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 100%); display:flex; flex-direction:column; align-items:center; gap:20px; }
        #status { background:rgba(8,8,16,.6); border:1px solid rgba(255,255,255,.08); color:rgba(255,255,255,.85); font-size:.8rem; font-weight:500; padding:8px 18px; border-radius:100px; text-align:center; backdrop-filter:blur(12px); max-width:320px; }
        .btn-row { display:flex; gap:20px; align-items:center; pointer-events:all; }
        .side-btn { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.12); color:#fff; padding:10px 18px; border-radius:100px; font-size:.8rem; font-weight:600; font-family:inherit; cursor:pointer; display:flex; align-items:center; gap:6px; backdrop-filter:blur(12px); }
        #cap-btn { width:68px; height:68px; background:#fff; border:3px solid rgba(255,255,255,.4); border-radius:50%; font-size:1.6rem; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 24px rgba(0,0,0,.4); pointer-events:all; }

        #toast { position:absolute; bottom:160px; left:50%; transform:translateX(-50%); background:rgba(8,8,16,.85); border:1px solid rgba(255,255,255,.1); color:#fff; padding:10px 20px; border-radius:100px; font-size:.8rem; z-index:50; opacity:0; transition:opacity .3s; white-space:nowrap; pointer-events:none; }
        #toast.on { opacity:1; }
    </style>
</head>
<body>

<video id="camera-feed" autoplay muted playsinline webkit-playsinline></video>
<canvas id="ar-canvas"></canvas>
<canvas id="debug-canvas"></canvas>

<div id="loading-screen">
    <div class="ld-logo"><div class="ld-icon">👟</div><div class="ld-name">Jay Quantum</div></div>
    <div class="ld-tag">ViewAR Fashion Studio</div>
    <div class="ld-ring"></div>
    <div class="ld-track"><div class="ld-fill" id="ld-bar"></div></div>
    <div id="ld-status">Initializing…</div>
</div>

<div id="perm-screen">
    <div class="perm-icon">📷</div>
    <div class="perm-title">Camera Access Required</div>
    <div class="perm-desc">ViewAR needs your camera to try on shoes. Video is processed on-device and never uploaded.</div>
    <button class="perm-btn" id="perm-btn">Allow Camera →</button>
</div>

<div id="ui">
    <div id="top-bar">
        <button class="back-btn" id="back-btn">←</button>
        <span id="prod-name">Loading…</span>
        <span class="mode-badge" id="mode-badge">Try-On</span>
    </div>
    <div id="guide" class="on">
        <div class="g-box"><div class="g-icon">👟</div></div>
        <div class="g-text">Point camera at your feet</div>
    </div>
    <div id="dots">
        <div class="dot" id="dot-l"><div class="dot-circle"></div><span class="dot-label">L foot</span></div>
        <div class="dot" id="dot-r"><div class="dot-circle"></div><span class="dot-label">R foot</span></div>
    </div>
    <div id="bottom">
        <div id="status">Initializing…</div>
        <div class="btn-row">
            <button class="side-btn" id="flip-btn">🔄 Flip</button>
            <button id="cap-btn">📸</button>
            <button class="side-btn" id="share-btn">↗ Share</button>
        </div>
    </div>
</div>
<div id="toast"></div>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
    "imports": {
        "three":         "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ── URL PARAMS ────────────────────────────────────────────────────
const P          = new URLSearchParams(window.location.search);
const MODEL_URL  = P.get('model');
const PROD_NAME  = P.get('name') || 'Fashion Item';
const TYPE       = (P.get('type') || 'shoe').toLowerCase();
const DEBUG      = P.get('debug') === '1';
const FLIP       = P.get('flip')  === '1';   // try if dots appear but wrong direction
const SCALE_MULT = parseFloat(P.get('scale') || '1.3');

document.getElementById('prod-name').textContent = PROD_NAME;
document.getElementById('mode-badge').textContent =
    TYPE === 'clothing' ? 'Clothing Try-On' : TYPE === 'accessory' ? 'Face Try-On' : 'Shoe Try-On';
if (DEBUG) document.getElementById('debug-canvas').classList.add('on');

// ── GLOBALS ───────────────────────────────────────────────────────
const video   = document.getElementById('camera-feed');
const dbgCvs  = document.getElementById('debug-canvas');
const dbgCtx  = dbgCvs.getContext('2d');

let scene, cam3, renderer;
let leftGrp, rightGrp;
let modelLoaded   = false;
let landmarker    = null;
let rotCanvas     = null;   // offscreen canvas for pre-rotated video
let rotCtx        = null;
let lastTime      = -1;
let running       = false;
let tracked       = false;
let camFacing     = 'environment';

// ── UI HELPERS ────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function progress(pct, msg) { $('ld-bar').style.width=pct+'%'; $('ld-status').textContent=msg; }
function hideLoader() { const el=$('loading-screen'); el.style.opacity='0'; setTimeout(()=>el.style.display='none',600); }
function setStatus(m) { $('status').textContent = m; }
function setGuide(v)  { $('guide').classList.toggle('on', v); }
function toast(m,ms=2800) { const t=$('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),ms); }
function setDots(l,r) {
    const dl=$('dot-l'), dr=$('dot-r'), any=l||r;
    dl.classList.toggle('on',any); dl.classList.toggle('ok',l);
    dr.classList.toggle('on',any); dr.classList.toggle('ok',r);
}

// ── THREE.JS SETUP ────────────────────────────────────────────────
function initThree() {
    const W=innerWidth, H=innerHeight;
    scene = new THREE.Scene();
    cam3  = new THREE.OrthographicCamera(-W/2, W/2, H/2, -H/2, -2000, 2000);
    cam3.position.z = 1000;

    renderer = new THREE.WebGLRenderer({
        canvas: $('ar-canvas'),
        alpha: true, antialias: true,
        premultipliedAlpha: false,
        preserveDrawingBuffer: true
    });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2.5));
    renderer.setClearColor(0,0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const k = new THREE.DirectionalLight(0xffffff, 1.0); k.position.set(0,5,10); scene.add(k);
    const f = new THREE.DirectionalLight(0xffffff, 0.4); f.position.set(0,-5,6); scene.add(f);
    const r = new THREE.DirectionalLight(0xffffff, 0.2); r.position.set(0,0,-10); scene.add(r);
}

// ── GLB LOADING ───────────────────────────────────────────────────
function loadModel(url) {
    return new Promise(resolve => {
        progress(40,'Loading 3D shoe model…');
        new GLTFLoader().load(url,
            gltf => {
                const m = gltf.scene;

                // Make all meshes double-sided so shoe is always visible
                m.traverse(c => {
                    if (!c.isMesh) return;
                    [].concat(c.material).forEach(mat => { mat.side = THREE.DoubleSide; mat.needsUpdate=true; });
                });

                // Normalize to 1 world unit
                const box = new THREE.Box3().setFromObject(m);
                const sz  = box.getSize(new THREE.Vector3());
                let   md  = Math.max(sz.x, sz.y, sz.z);
                if (!isFinite(md) || md < 1e-4 || md > 1e4) { console.warn('[ViewAR] Bad bounding box, md=',md); md=1; }
                console.log('[ViewAR] Shoe size:', sz.x.toFixed(3), sz.y.toFixed(3), sz.z.toFixed(3), '→ maxDim', md.toFixed(4));

                m.scale.setScalar(1/md);
                const box2 = new THREE.Box3().setFromObject(m);
                m.position.sub(box2.getCenter(new THREE.Vector3()));

                leftGrp  = new THREE.Group(); leftGrp.add(m.clone(true));  leftGrp.visible=false;  scene.add(leftGrp);
                rightGrp = new THREE.Group();
                const rm = m.clone(true); rm.scale.x *= FLIP ? 1 : -1;
                rightGrp.add(rm); rightGrp.visible=false; scene.add(rightGrp);

                modelLoaded = true;
                progress(80,'Shoe ready!');
                resolve();
            },
            xhr => { if(xhr.total>0) progress(40+(xhr.loaded/xhr.total)*35, `Loading model: ${Math.round(xhr.loaded/xhr.total*100)}%`); },
            err => { console.error('[ViewAR] GLB error:',err); setStatus('⚠️ Model load failed'); progress(80,'Model error'); resolve(); }
        );
    });
}

// ── MEDIAPIPE ─────────────────────────────────────────────────────
async function initMP() {
    progress(8,'Loading AI pose detection…');
    const { PoseLandmarker, FilesetResolver } = await import(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.mjs'
    );
    progress(22,'Loading pose model…');
    const vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm'
    );
    progress(35,'Building pose detector…');
    landmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
            modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
            delegate:'GPU'
        },
        runningMode:'VIDEO', numPoses:1,
        minPoseDetectionConfidence:0.5,
        minPosePresenceConfidence:0.5,
        minTrackingConfidence:0.5
    });
    console.log('[ViewAR] MediaPipe ready');
}

// ── CAMERA ────────────────────────────────────────────────────────
async function startCam(facing='environment') {
    if (video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
    try {
        const s = await navigator.mediaDevices.getUserMedia({
            video:{ facingMode:{ideal:facing}, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30,min:15} },
            audio:false
        });
        video.srcObject = s; camFacing = facing;
        await new Promise(r => { video.onloadedmetadata=r; setTimeout(r,3000); });
        await video.play();
        console.log('[ViewAR] Camera:', facing, video.videoWidth+'x'+video.videoHeight);
        setupRotCanvas();
    } catch(err) {
        if (err.name==='NotAllowedError') { $('perm-screen').classList.add('on'); throw err; }
        const s2 = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});
        video.srcObject=s2;
        await new Promise(r=>{video.onloadedmetadata=r;setTimeout(r,3000);}); await video.play();
        setupRotCanvas();
    }
}

// ── OFFSCREEN ROTATION CANVAS ─────────────────────────────────────
//
// THE CORE FIX FOR v1.3:
//
// Android back camera streams a LANDSCAPE buffer (e.g. 1280×720) even
// when the phone is portrait. The BROWSER rotates this for display so
// you see it correctly, but MediaPipe's detectForVideo() processes the
// RAW buffer — it sees landscape, not portrait.
//
// Result: MediaPipe landmarks are in landscape coordinates, not portrait.
// When we map them to the portrait screen they land in the wrong place.
//
// Solution: draw each video frame to an offscreen canvas WITH the same
// rotation the browser applies (90° CW for Android back camera).
// MediaPipe then processes the already-rotated canvas and gives
// landmarks directly in portrait screen coordinates. No axis-swap math.
//
// After this fix, landmark (lm.x, lm.y) maps directly to screen:
//   screenX = lm.x * window.innerWidth
//   screenY = lm.y * window.innerHeight

function setupRotCanvas() {
    const vW = video.videoWidth, vH = video.videoHeight;
    const W  = innerWidth,       H  = innerHeight;

    const videoIsLandscape  = vW > vH;
    const screenIsPortrait  = H  > W;
    const needsRotation     = videoIsLandscape && screenIsPortrait;

    console.log('[ViewAR] Video', vW+'x'+vH, '| Screen', W+'x'+H, '| Needs rotation:', needsRotation);

    if (!needsRotation) {
        rotCanvas = null; // same orientation — feed video directly
        return;
    }

    rotCanvas = document.createElement('canvas');
    rotCanvas.width  = W;
    rotCanvas.height = H;
    rotCtx = rotCanvas.getContext('2d');

    // Resize debug canvas to match screen
    dbgCvs.width=W; dbgCvs.height=H;
    console.log('[ViewAR] Rotation canvas created:', W+'x'+H);
}

// Draw one video frame onto the rotation canvas (correct portrait orientation)
function drawRotatedFrame() {
    if (!rotCanvas) return;  // no rotation needed
    const vW = video.videoWidth, vH = video.videoHeight;
    const W  = rotCanvas.width,  H  = rotCanvas.height;

    rotCtx.clearRect(0, 0, W, H);
    rotCtx.save();

    // Android back camera rotation: 90° CW
    // ?flip=1 tries 90° CCW if CW gives wrong result
    if (!FLIP) {
        // 90° CW: translate to top-right, rotate clockwise
        rotCtx.translate(W, 0);
        rotCtx.rotate(Math.PI / 2);
        // In rotated space: width = H (portrait height), height = W (portrait width)
        // Scale landscape video (vW×vH) to fill rotated space (H×W)
        const scale = Math.max(H / vW, W / vH);
        const dw = vW * scale, dh = vH * scale;
        rotCtx.drawImage(video, (H-dw)/2, (W-dh)/2, dw, dh);
    } else {
        // 90° CCW: translate to bottom-left, rotate counter-clockwise
        rotCtx.translate(0, H);
        rotCtx.rotate(-Math.PI / 2);
        const scale = Math.max(H / vW, W / vH);
        const dw = vW * scale, dh = vH * scale;
        rotCtx.drawImage(video, (H-dw)/2, (W-dh)/2, dw, dh);
    }

    rotCtx.restore();
}

// Return the canvas MediaPipe should process each frame
function getFrame() {
    if (!rotCanvas) return video;   // same orientation: process video directly
    drawRotatedFrame();
    return rotCanvas;
}

// ── COORDINATE MAPPING ────────────────────────────────────────────
// After pre-rotation, landmarks are in portrait screen space: direct map.
function lmToWorld(lm) {
    const W = innerWidth, H = innerHeight;
    return new THREE.Vector2(
        lm.x * W - W/2,   // x: 0=centre, right=positive
        H/2 - lm.y * H    // y: 0=centre, up=positive (Three.js convention)
    );
}

// ── DEBUG DOTS ───────────────────────────────────────────────────
// Coloured circles drawn at each foot landmark — confirms coordinate mapping.
// Red=heel, Blue=ankle, Green=toe   L=left, R=right suffix colour shades.
const DBG_COL = {27:'#60a5fa',28:'#22d3ee',29:'#f87171',30:'#fb923c',31:'#4ade80',32:'#a3e635'};
function drawDebug(lms) {
    dbgCtx.clearRect(0,0,dbgCvs.width,dbgCvs.height);
    if (!lms) return;
    [27,28,29,30,31,32].forEach(i => {
        const lm = lms[i];
        if (!lm || lm.visibility < 0.2) return;
        const sx = lm.x * innerWidth, sy = lm.y * innerHeight;
        dbgCtx.beginPath(); dbgCtx.arc(sx,sy,14,0,Math.PI*2);
        dbgCtx.fillStyle = DBG_COL[i]||'#fff'; dbgCtx.fill();
        dbgCtx.strokeStyle='#fff'; dbgCtx.lineWidth=2; dbgCtx.stroke();
        dbgCtx.fillStyle='#000'; dbgCtx.font='bold 11px sans-serif';
        dbgCtx.textAlign='center'; dbgCtx.textBaseline='middle';
        dbgCtx.fillText(i, sx, sy);
    });
}

// ── SHOE PLACEMENT ────────────────────────────────────────────────
const VIS   = 0.3;    // minimum MediaPipe visibility confidence
const SP    = 0.55;   // position smoothing (0=none)
const SS    = 0.65;   // scale smoothing

function placeShoe(heelLm, ankleLm, toeLm, grp, mirror) {
    if (!grp || !modelLoaded) return false;

    const hOK = heelLm.visibility  > VIS;
    const aOK = ankleLm.visibility > VIS;
    const tOK = toeLm.visibility   > VIS;
    if ((hOK?1:0)+(aOK?1:0)+(tOK?1:0) < 2) { grp.visible=false; return false; }

    const hW = hOK ? lmToWorld(heelLm)  : null;
    const aW = aOK ? lmToWorld(ankleLm) : null;
    const tW = tOK ? lmToWorld(toeLm)   : null;

    let cx, cy, angle, len;

    if (hOK && tOK) {
        cx    = (hW.x+tW.x)/2; cy = (hW.y+tW.y)/2;
        len   = hW.distanceTo(tW);
        angle = Math.atan2(tW.y-hW.y, tW.x-hW.x);
    } else if (aOK && tOK) {
        cx    = (aW.x+tW.x)/2; cy = (aW.y+tW.y)/2;
        len   = aW.distanceTo(tW)*1.4;
        angle = Math.atan2(tW.y-aW.y, tW.x-aW.x);
    } else {
        const dir = new THREE.Vector2(aW.x-hW.x, aW.y-hW.y);
        len   = hW.distanceTo(aW)*2;
        angle = Math.atan2(dir.y, dir.x);
        const dn = dir.clone().normalize();
        cx    = hW.x+dn.x*len/2; cy = hW.y+dn.y*len/2;
    }

    if (!isFinite(angle)) { grp.visible=false; return false; }

    // Safety net: if footLength is tiny (bad detection), use screen-based estimate
    if (len < innerWidth * 0.06) {
        console.warn('[ViewAR] footLength too small ('+len.toFixed(1)+'), using fallback');
        len = innerWidth * 0.28;   // ~28% of screen width ≈ reasonable foot size
    }

    grp.visible = true;

    // Position (smoothed lerp)
    if (!grp.userData.placed) {
        grp.position.set(cx, cy, 0);
        grp.userData.placed = true;
    } else {
        grp.position.x = grp.position.x*SP + cx*(1-SP);
        grp.position.y = grp.position.y*SP + cy*(1-SP);
    }
    grp.position.z = 0;

    // Rotation: keep shoe flat in XY plane (facing camera), rotate in screen plane
    grp.quaternion.setFromEuler(new THREE.Euler(0, 0, angle, 'XYZ'));

    // Scale (smoothed)
    const target = len * SCALE_MULT;
    const cur    = Math.abs(grp.scale.x) || target;
    const s      = cur*SS + target*(1-SS);
    grp.scale.set(mirror ? -s : s, s, s);

    return true;
}

// ── ANIMATION LOOP ────────────────────────────────────────────────
function startLoop() {
    running = true;
    (function frame() {
        if (!running) return;
        requestAnimationFrame(frame);

        if (video.readyState >= 2 && video.currentTime !== lastTime) {
            lastTime = video.currentTime;
            if (landmarker && modelLoaded) {
                try {
                    // Feed pre-rotated canvas (or video if no rotation needed)
                    const results = landmarker.detectForVideo(getFrame(), performance.now());
                    handlePose(results);
                } catch(e) { /* skip frame */ }
            }
        }
        renderer.render(scene, cam3);
    })();
}

function handlePose(results) {
    if (!results.landmarks || !results.landmarks.length) {
        if (leftGrp)  leftGrp.visible  = false;
        if (rightGrp) rightGrp.visible = false;
        if (DEBUG) drawDebug(null);
        if (tracked) { tracked=false; setGuide(true); setStatus('👣 Move feet into view'); setDots(false,false); }
        return;
    }
    const lm = results.landmarks[0];
    if (DEBUG) drawDebug(lm);

    // Landmarks: 27=L ankle 28=R ankle 29=L heel 30=R heel 31=L toe 32=R toe
    const L = placeShoe(lm[29], lm[27], lm[31], leftGrp,  false);
    const R = placeShoe(lm[30], lm[28], lm[32], rightGrp, true);
    const any = L||R;
    setDots(L,R);

    if (any && !tracked)  { tracked=true;  setGuide(false); setStatus('✨ Looking great! Walk to see them move'); }
    if (!any && tracked)  { tracked=false; setGuide(true);  setStatus('👟 Point camera down at your feet'); }
}

// ── SCREENSHOT / SHARE ────────────────────────────────────────────
async function capture() {
    setStatus('📸 Saving…');
    const W=innerWidth, H=innerHeight;
    const mc=document.createElement('canvas');
    mc.width=W*devicePixelRatio; mc.height=H*devicePixelRatio;
    const ctx=mc.getContext('2d');
    ctx.scale(devicePixelRatio,devicePixelRatio);
    const vW=video.videoWidth,vH=video.videoHeight;
    const vA=vW/vH, sA=W/H;
    let dx=0,dy=0,dw=W,dh=H;
    if(vA>sA){dw=H*vA;dx=(W-dw)/2;}else{dh=W/vA;dy=(H-dh)/2;}
    ctx.drawImage(video,dx,dy,dw,dh);
    ctx.drawImage(renderer.domElement,0,0,W,H);
    const fname=`viewar-${PROD_NAME.replace(/\s+/g,'-')}.jpg`;
    mc.toBlob(async blob=>{
        if(navigator.share&&navigator.canShare){
            const f=new File([blob],fname,{type:'image/jpeg'});
            if(navigator.canShare({files:[f]})){
                try{await navigator.share({files:[f],title:PROD_NAME});setStatus('✅ Shared!');setTimeout(()=>setStatus('✨ Looking great!'),2000);return;}catch(e){}
            }
        }
        const u=URL.createObjectURL(blob);
        Object.assign(document.createElement('a'),{href:u,download:fname}).click();
        URL.revokeObjectURL(u);
        toast('📸 Photo saved!');
        setTimeout(()=>setStatus('✨ Looking great!'),500);
    },'image/jpeg',0.92);
}

// ── RESIZE ───────────────────────────────────────────────────────
window.addEventListener('resize', () => {
    const W=innerWidth,H=innerHeight;
    cam3.left=-W/2;cam3.right=W/2;cam3.top=H/2;cam3.bottom=-H/2;
    cam3.updateProjectionMatrix();
    renderer.setSize(W,H);
    if(rotCanvas){rotCanvas.width=W;rotCanvas.height=H;}
    dbgCvs.width=W; dbgCvs.height=H;
});

// ── EVENTS ───────────────────────────────────────────────────────
$('back-btn').addEventListener('click',  ()=>history.length>1?history.back():window.close());
$('cap-btn').addEventListener('click',   capture);
$('share-btn').addEventListener('click', capture);
$('flip-btn').addEventListener('click', async()=>{
    const nxt=camFacing==='environment'?'user':'environment';
    try{await startCam(nxt);toast(nxt==='user'?'📷 Front camera':'📷 Back camera');}
    catch(e){toast('⚠️ Could not switch camera');}
});
$('perm-btn').addEventListener('click', async()=>{
    $('perm-screen').classList.remove('on');
    try{await startCam('environment');}catch(e){toast('⚠️ Camera permission denied');}
});
document.addEventListener('contextmenu', e=>e.preventDefault());

// ── STARTUP ───────────────────────────────────────────────────────
async function init() {
    try {
        console.log('[ViewAR] v1.3 | type:', TYPE, '| model:', MODEL_URL);
        console.log('[ViewAR] SCALE_MULT:', SCALE_MULT, '| FLIP:', FLIP, '| DEBUG:', DEBUG);

        progress(4,'Setting up 3D scene…'); initThree();
        await initMP();
        if (MODEL_URL) { await loadModel(MODEL_URL); }
        else { progress(80,'No model URL provided'); console.warn('[ViewAR] No ?model= param'); }

        progress(85,'Starting camera…');
        try { await startCam('environment'); }
        catch(e) { progress(90,'Waiting for camera permission…'); return; }

        progress(96,'Starting AR engine…');
        startLoop();

        progress(100,'Ready!');
        await new Promise(r=>setTimeout(r,350));
        hideLoader();
        setStatus('👟 Point camera down at your feet');
        console.log('[ViewAR] v1.3 Ready!');

    } catch(err) {
        console.error('[ViewAR] Fatal:', err);
        progress(0,'⚠️ Failed to start. Please refresh.');
    }
}

init();
</script>
